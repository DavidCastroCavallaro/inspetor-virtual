server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> container backend na rede interna do compose
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 25m;   # imagens base64 (backend aceita até 25mb)
    }

    # cache dos assets com hash
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
